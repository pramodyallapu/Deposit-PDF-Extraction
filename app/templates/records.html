<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EOB Extraction · Records</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap-grid.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@400;500;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --paper: #EDEFE7;
      --paper-deep: #E3E6DC;
      --card: #FCFDFA;
      --ink: #1C2620;
      --ink-soft: #4A5750;
      --muted: #7C8A80;
      --line: #D2D8C9;
      --accent: #2F6F5E;
      --accent-dark: #1F4A3E;
      --accent-tint: #DEEAE3;
      --amber: #B07C2C;
      --amber-tint: #F3E7D2;
      --rose: #A0433F;
      --rose-tint: #F3DEDC;
      --radius: 10px;
      --shadow: 0 1px 2px rgba(28,38,32,0.06), 0 6px 20px -10px rgba(28,38,32,0.18);
    }
    body {
      background: var(--paper);
      color: var(--ink);
      font-family: 'Inter', system-ui, sans-serif;
      height: 100vh;
      overflow: hidden;
    }
    .app { display: flex; flex-direction: column; height: 100vh; }
    .app-header {
      flex: 0 0 auto;
      background: var(--card);
      border-bottom: 1px solid var(--line);
      padding: 14px 24px;
      display: flex;
      align-items: center;
      gap: 18px;
    }
    .app-header .stamp-mark {
      width: 40px; height: 40px; border-radius: 50%; border: 2px solid var(--accent);
      display: flex; align-items: center; justify-content: center;
      color: var(--accent); font-family: 'Roboto Slab', serif; font-weight: 700; font-size: 1rem;
    }
    .app-header h1 {
      font-family: 'Roboto Slab', serif; font-weight: 700; font-size: 1.6rem;
      margin: 0; letter-spacing: -0.01em;
    }
    .app-header .tagline {
      margin: 0 0 0 12px; color: var(--ink-soft); font-size: 0.9rem;
    }
    .app-body { display: flex; flex: 1; overflow: hidden; }
    .sidebar {
      flex: 0 0 230px;
      background: var(--card);
      border-right: 1px solid var(--line);
      padding: 20px 12px;
      overflow-y: auto;
    }
    .sidebar .nav-section-title {
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 10px;
    }
    .sidebar .nav-item {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      padding: 10px 14px;
      border-radius: 8px;
      border: 1px solid transparent;
      background: transparent;
      color: var(--ink-soft);
      cursor: pointer;
      font-weight: 600;
      font-size: 0.9rem;
      margin-bottom: 4px;
      text-decoration: none;
      transition: background 0.15s, border-color 0.15s, color 0.15s;
    }
    .sidebar .nav-item:hover,
    .sidebar .nav-item.active {
      background: var(--accent-tint);
      color: var(--accent-dark);
      border-color: var(--accent-tint);
    }
    .sidebar .nav-item i { font-size: 1.2rem; width: 1.4rem; text-align: center; }

    .main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      padding: 24px 32px;
      background: var(--paper);
    }

    /* ----- Table styles ----- */
    .table-wrapper {
      flex: 1;
      overflow: auto;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--card);
      box-shadow: var(--shadow);
    }
    .table-wrapper table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.85rem;
      font-family: 'Inter', sans-serif;
      min-width: 700px;
    }
    .table-wrapper thead {
      background: var(--paper-deep);
      border-bottom: 2px solid var(--line);
      position: sticky;
      top: 0;
      z-index: 2;
    }
    .table-wrapper thead th {
      padding: 12px 16px;
      text-align: left;
      font-weight: 600;
      color: var(--ink-soft);
      letter-spacing: 0.02em;
      font-size: 0.75rem;
      text-transform: uppercase;
      white-space: nowrap;
    }
    .table-wrapper tbody tr {
      border-bottom: 1px solid var(--line);
      transition: background 0.1s ease;
    }
    .table-wrapper tbody tr:hover {
      background: var(--accent-tint);
    }
    .table-wrapper tbody tr:last-child {
      border-bottom: none;
    }
    .table-wrapper tbody td {
      padding: 10px 16px;
      vertical-align: middle;
      color: var(--ink);
      word-break: break-word;
      max-width: 200px;
    }
    .table-wrapper tbody td .cpt-badge {
      display: inline-block;
      background: var(--paper-deep);
      border: 1px solid var(--line);
      border-radius: 4px;
      padding: 0 6px;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.7rem;
      margin: 1px 2px 1px 0;
    }
    .table-wrapper .empty-state {
      padding: 48px 20px;
      text-align: center;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .action-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px 16px;
      padding: 12px 16px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      margin-top: 12px;
      flex-shrink: 0;
    }
    .action-bar .badge-count {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.75rem;
      background: var(--accent-tint);
      color: var(--accent-dark);
      padding: 2px 12px;
      border-radius: 999px;
      border: 1px solid var(--accent);
      font-weight: 600;
      white-space: nowrap;
    }
    .action-bar .btn {
      font-weight: 600;
      font-size: 0.8rem;
      padding: 6px 16px;
      border-radius: 999px;
      border: none;
      cursor: pointer;
      transition: background .15s, transform .1s;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--paper-deep);
      color: var(--ink-soft);
      border: 1px solid var(--line);
      white-space: nowrap;
    }
    .action-bar .btn:hover { transform: translateY(-1px); }
    .action-bar .btn-download {
      background: var(--amber);
      color: white;
      border-color: var(--amber);
    }
    .action-bar .btn-download:hover { background: #8f6624; }
    .action-bar .btn-download:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .action-bar .btn-danger {
      background: var(--rose);
      color: white;
      border-color: var(--rose);
    }
    .action-bar .btn-danger:hover { background: #7a2e2b; }
    .action-bar .btn-danger:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .action-bar .toast-msg {
      font-size: 0.8rem;
      color: var(--ink-soft);
      animation: fadeIn 0.3s ease;
      flex: 1;
      min-width: 60px;
    }
    .action-bar .spacer { flex: 1; }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 768px) {
      .sidebar { flex: 0 0 60px; padding: 12px 6px; }
      .sidebar .nav-item span { display: none; }
      .sidebar .nav-item { justify-content: center; }
      .app-header .tagline { display: none; }
      .main-content { padding: 16px; }
      .action-bar { flex-direction: column; align-items: stretch; }
      .action-bar .btn { justify-content: center; }
      .action-bar .spacer { display: none; }
      .table-wrapper tbody td { max-width: 120px; }
    }
  </style>
</head>
<body>
<div class="app">
  <header class="app-header">
    <div class="stamp-mark">EOB</div>
    <h1>Records</h1>
    <span class="tagline">Saved deposits</span>
  </header>
  <div class="app-body">
    <aside class="sidebar">
      <div class="nav-section-title">Main</div>
      <a href="/" class="nav-item"><i class="bi bi-file-earmark-arrow-up"></i><span>Extract</span></a>
      <a href="/records" class="nav-item active"><i class="bi bi-table"></i><span>Records</span></a>
      <a href="/admin" class="nav-item"><i class="bi bi-shield-lock"></i><span>Admin</span></a>
    </aside>
    <main class="main-content">
      <h2 style="font-family:'Roboto Slab',serif; font-weight:700; font-size:1.4rem; margin-bottom:16px;">Submitted Records</h2>

      <div class="table-wrapper" id="tableWrapper">
        <table>
          <thead>
            <tr>
              <th>Check #</th>
              <th>Date</th>
              <th>Amount</th>
              <th>Insurance</th>
              <th>Practice</th>
              <th>CPT Codes</th>
              <th>CPT Count</th>
            </tr>
          </thead>
          <tbody id="recordsBody">
            <tr><td colspan="7" class="empty-state">Loading records…</td></tr>
          </tbody>
        </table>
      </div>

      <div class="action-bar" id="actionBar">
        <span class="badge-count"><i class="bi bi-database"></i> <span id="recordCountSpan">0</span> records</span>
        <div class="spacer"></div>
        <button class="btn btn-download" id="downloadBtn" disabled><i class="bi bi-download"></i> Download CSV</button>
        <button class="btn btn-danger" id="clearBtn" disabled><i class="bi bi-trash3"></i> Clear All</button>
        <span id="actionToast" class="toast-msg"></span>
      </div>
    </main>
  </div>
</div>

<script>
  // ----- DOM refs -----
  const recordsBody = document.getElementById('recordsBody');
  const recordCountSpan = document.getElementById('recordCountSpan');
  const downloadBtn = document.getElementById('downloadBtn');
  const clearBtn = document.getElementById('clearBtn');
  const actionToast = document.getElementById('actionToast');

  let records = [];

  // ----- helpers -----
  function showToast(msg, isGood = true) {
    actionToast.textContent = msg;
    actionToast.style.color = isGood ? 'var(--accent-dark)' : 'var(--rose)';
    clearTimeout(window.toastTimer);
    window.toastTimer = setTimeout(() => { actionToast.textContent = ''; }, 4000);
  }

  function updateCounter() {
    const count = records.length;
    recordCountSpan.textContent = count;
    downloadBtn.disabled = count === 0;
    clearBtn.disabled = count === 0;
  }

  // ----- render table -----
  function renderRecords() {
    if (!records.length) {
      recordsBody.innerHTML = `<tr><td colspan="7" class="empty-state">No records saved yet.</td></tr>`;
      return;
    }
    recordsBody.innerHTML = records.map(r => `
      <tr>
        <td><strong>${r.checkNumber || '—'}</strong></td>
        <td>${r.checkDate || '—'}</td>
        <td>${r.checkAmount || '—'}</td>
        <td>${r.insuranceName || '—'}</td>
        <td>${r.practiceName || '—'}</td>
        <td>${formatCpts(r.cptCodes)}</td>
        <td>${r.cptCount || '0'}</td>
      </tr>
    `).join('');
  }

  function formatCpts(cptString) {
    if (!cptString) return '—';
    const codes = cptString.split(';').map(s => s.trim()).filter(Boolean);
    return codes.map(c => `<span class="cpt-badge">${c}</span>`).join(' ');
  }

  // ----- load records from server -----
  async function loadRecords() {
    try {
      const res = await fetch('api/records');
      if (!res.ok) throw new Error('Failed to fetch records');
      records = await res.json();
      renderRecords();
      updateCounter();
    } catch (err) {
      recordsBody.innerHTML = `<tr><td colspan="7" class="empty-state" style="color:var(--rose);">Error: ${err.message}</td></tr>`;
    }
  }

  // ----- Download CSV (with leading-zero protection) -----
  // Note: a bare leading apostrophe (e.g. "'0091") is only honored by Excel
  // when a value is typed/pasted directly into a cell. When Excel OPENS a
  // .csv file it re-parses each field with its own number detection and the
  // apostrophe is not reliably respected, so "0091" would come back as 91.
  // Wrapping the value as an Excel text formula (="0091") forces it to be
  // read as literal text every time, regardless of how the file is opened.
  function csvEscape(value) {
    // Standard CSV escaping: wrap in quotes, double any internal quotes.
    return '"' + String(value ?? '').replace(/"/g, '""') + '"';
  }

  function downloadCSV() {
    if (records.length === 0) {
      showToast('No records to download.', false);
      return;
    }
    const headers = ['Check Number', 'Check Date', 'Check Amount', 'Insurance / Payor', 'Practice / Provider', 'CPT Codes', 'CPT Count'];
    const rows = records.map(r => [
      r.checkNumber ? `="${String(r.checkNumber).replace(/"/g, '""')}"` : '',
      r.checkDate || '',
      r.checkAmount || '',
      r.insuranceName || '',
      r.practiceName || '',
      r.cptCodes || '',
      r.cptCount || ''
    ]);
    const csvContent = [headers.map(csvEscape).join(','), ...rows.map(row => row.map(csvEscape).join(','))].join('\n');
    const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
    const link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    const now = new Date();
    const dateStr = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
    link.download = `claim_ledger_${dateStr}.csv`;
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    URL.revokeObjectURL(link.href);
    showToast(`📥 Downloaded ${records.length} record${records.length !== 1 ? 's' : ''}.`);
    clearAllRecords();  // Clear records after download
  }

  // ----- Clear all records -----
  async function clearAllRecords() {
    if (records.length === 0) return;
    if (!confirm(`Delete all ${records.length} submitted records? This cannot be undone.`)) return;
    try {
      const res = await fetch('api/records', { method: 'DELETE' });
      if (!res.ok) throw new Error('Failed to clear records');
      records = [];
      renderRecords();
      updateCounter();
      showToast('🗑️ All records cleared.');
    } catch (err) {
      showToast('Failed to clear records: ' + err.message, false);
    }
  }

  // ----- Event listeners -----
  downloadBtn.addEventListener('click', downloadCSV);
  clearBtn.addEventListener('click', clearAllRecords);

  // ----- Init -----
  loadRecords();
</script>
</body>
</html>
