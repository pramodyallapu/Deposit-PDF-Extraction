<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EOB Extraction · Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap-grid.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@400;500;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --paper: #EDEFE7;
      --paper-deep: #E3E6DC;
      --card: #FCFDFA;
      --ink: #1C2620;
      --ink-soft: #4A5750;
      --muted: #7C8A80;
      --line: #D2D8C9;
      --accent: #2F6F5E;
      --accent-dark: #1F4A3E;
      --accent-tint: #DEEAE3;
      --amber: #B07C2C;
      --amber-tint: #F3E7D2;
      --rose: #A0433F;
      --rose-tint: #F3DEDC;
      --radius: 10px;
      --shadow: 0 1px 2px rgba(28,38,32,0.06), 0 6px 20px -10px rgba(28,38,32,0.18);
    }
    body {
      background: var(--paper);
      color: var(--ink);
      font-family: 'Inter', system-ui, sans-serif;
      height: 100vh;
      overflow: hidden;
    }
    .app { display: flex; flex-direction: column; height: 100vh; }
    .app-header {
      flex: 0 0 auto;
      background: var(--card);
      border-bottom: 1px solid var(--line);
      padding: 14px 24px;
      display: flex;
      align-items: center;
      gap: 18px;
    }
    .app-header .stamp-mark {
      width: 40px; height: 40px; border-radius: 50%; border: 2px solid var(--accent);
      display: flex; align-items: center; justify-content: center;
      color: var(--accent); font-family: 'Roboto Slab', serif; font-weight: 700; font-size: 1rem;
    }
    .app-header h1 {
      font-family: 'Roboto Slab', serif; font-weight: 700; font-size: 1.6rem;
      margin: 0; letter-spacing: -0.01em;
    }
    .app-header .tagline {
      margin: 0 0 0 12px; color: var(--ink-soft); font-size: 0.9rem;
    }
    .app-body { display: flex; flex: 1; overflow: hidden; }
    .sidebar {
      flex: 0 0 230px;
      background: var(--card);
      border-right: 1px solid var(--line);
      padding: 20px 12px;
      overflow-y: auto;
    }
    .sidebar .nav-section-title {
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 10px;
    }
    .sidebar .nav-item {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      padding: 10px 14px;
      border-radius: 8px;
      border: 1px solid transparent;
      background: transparent;
      color: var(--ink-soft);
      cursor: pointer;
      font-weight: 600;
      font-size: 0.9rem;
      margin-bottom: 4px;
      text-decoration: none;
      transition: background 0.15s, border-color 0.15s, color 0.15s;
    }
    .sidebar .nav-item:hover,
    .sidebar .nav-item.active {
      background: var(--accent-tint);
      color: var(--accent-dark);
      border-color: var(--accent-tint);
    }
    .sidebar .nav-item i { font-size: 1.2rem; width: 1.4rem; text-align: center; }

    .main-content {
      flex: 1;
      overflow-y: auto;
      padding: 24px 32px;
      background: var(--paper);
    }

    .admin-layout {
      display: flex;
      gap: 32px;
      flex-wrap: wrap;
    }
    .entity-list {
      flex: 1 1 300px;
      min-width: 220px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 16px;
      max-height: 500px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
    }
    .entity-list .list-header {
      font-weight: 600;
      color: var(--ink-soft);
      border-bottom: 1px solid var(--line);
      padding-bottom: 8px;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .entity-list .list-items {
      flex: 1;
      overflow-y: auto;
    }
    .entity-list .list-item {
      padding: 8px 10px;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: background 0.1s;
      margin-bottom: 2px;
    }
    .entity-list .list-item:hover {
      background: var(--accent-tint);
    }
    .entity-list .list-item.active {
      background: var(--accent);
      color: white;
    }
    .entity-list .list-item .badge-aliases {
      font-size: 0.7rem;
      background: var(--paper-deep);
      padding: 2px 8px;
      border-radius: 999px;
      color: var(--ink-soft);
    }
    .entity-list .list-item.active .badge-aliases {
      background: rgba(255,255,255,0.2);
      color: white;
    }
    .entity-list .list-footer {
      margin-top: 12px;
      border-top: 1px solid var(--line);
      padding-top: 12px;
    }

    .entity-form {
      flex: 2 1 400px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 20px;
      display: none;
    }
    .entity-form.visible {
      display: block;
    }
    .entity-form .form-group {
      margin-bottom: 16px;
    }
    .entity-form label {
      display: block;
      font-weight: 600;
      font-size: 0.85rem;
      color: var(--ink-soft);
      margin-bottom: 4px;
    }
    .entity-form input[type="text"],
    .entity-form textarea {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 8px 12px;
      font: inherit;
      background: white;
    }
    .entity-form textarea {
      min-height: 80px;
      resize: vertical;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.9rem;
    }
    .entity-form .form-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 12px;
    }
    .btn {
      font-weight: 600;
      font-size: 0.85rem;
      padding: 8px 18px;
      border-radius: 999px;
      border: none;
      cursor: pointer;
      transition: background .15s, transform .1s;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--paper-deep);
      color: var(--ink-soft);
      border: 1px solid var(--line);
    }
    .btn:hover { transform: translateY(-1px); }
    .btn-primary { background: var(--accent); color: white; border-color: var(--accent); }
    .btn-primary:hover { background: var(--accent-dark); }
    .btn-danger { background: var(--rose); color: white; border-color: var(--rose); }
    .btn-danger:hover { background: #7a2e2b; }
    .btn-outline { background: transparent; border: 1px solid var(--line); color: var(--ink-soft); }
    .btn-outline:hover { background: var(--paper-deep); }
    .btn-success { background: var(--amber); color: white; border-color: var(--amber); }
    .btn-success:hover { background: #8f6624; }
    .btn:disabled { cursor: wait; opacity: 0.7; transform: none; }
    .btn-loader {
      width: 0.9rem; height: 0.9rem; border: 2px solid currentColor;
      border-right-color: transparent; border-radius: 50%;
      animation: spin .7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .tabs {
      display: flex;
      gap: 4px;
      margin-bottom: 20px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 4px;
    }
    .tab {
      padding: 8px 20px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.85rem;
      border: none;
      background: transparent;
      color: var(--ink-soft);
      transition: all 0.15s;
    }
    .tab:hover { background: var(--paper-deep); }
    .tab.active {
      background: var(--accent);
      color: white;
    }

    .bulk-import-area {
      margin-top: 16px;
      padding: 16px;
      background: var(--paper-deep);
      border-radius: var(--radius);
      border: 1px dashed var(--line);
    }
    .bulk-import-area textarea {
      width: 100%;
      min-height: 120px;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.85rem;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 8px 12px;
      background: white;
    }
    .bulk-import-area .bulk-actions {
      display: flex;
      gap: 10px;
      margin-top: 10px;
    }

    .status-msg {
      margin-top: 12px;
      font-size: 0.9rem;
      color: var(--ink-soft);
    }
    .status-msg.error { color: var(--rose); }
    .status-msg.success { color: var(--accent); }

    .mode-indicator {
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--muted);
      margin-left: 8px;
    }
    .mode-indicator.new {
      color: var(--amber);
    }

    @media (max-width: 768px) {
      .sidebar { flex: 0 0 60px; padding: 12px 6px; }
      .sidebar .nav-item span { display: none; }
      .sidebar .nav-item { justify-content: center; }
      .app-header .tagline { display: none; }
      .main-content { padding: 16px; }
      .admin-layout { flex-direction: column; }
      .entity-list { max-height: 250px; }
    }
  </style>
</head>
<body>
<div class="app">
  <header class="app-header">
    <div class="stamp-mark">EOB</div>
    <h1>Admin</h1>
    <span class="tagline">Manage payors and practices</span>
  </header>
  <div class="app-body">
    <aside class="sidebar">
      <div class="nav-section-title">Main</div>
      <a href="/" class="nav-item"><i class="bi bi-file-earmark-arrow-up"></i><span>Extract</span></a>
      <a href="/records" class="nav-item"><i class="bi bi-table"></i><span>Records</span></a>
      <a href="/admin" class="nav-item active"><i class="bi bi-shield-lock"></i><span>Admin</span></a>
    </aside>
    <main class="main-content">
      <h2 style="font-family:'Roboto Slab',serif; font-weight:700; font-size:1.4rem; margin-bottom:20px;">
        Entity Management
        <span id="modeIndicator" class="mode-indicator"></span>
      </h2>

      <div class="tabs">
        <button class="tab active" data-tab="payors" onclick="switchTab('payors')">
          <i class="bi bi-building"></i> Payors
        </button>
        <button class="tab" data-tab="practices" onclick="switchTab('practices')">
          <i class="bi bi-hospital"></i> Practices
        </button>
      </div>

      <div id="payorsPanel" class="admin-layout">
        <div class="entity-list" id="payorList">
          <div class="list-header">
            <span>Insurance Payors</span>
            <span style="font-weight:400; font-size:0.75rem; color:var(--muted);" id="payorCount">0</span>
          </div>
          <div class="list-items" id="payorItems"></div>
          <div class="list-footer">
            <button class="btn btn-success" id="addPayorBtn" style="width:100%; justify-content:center;">
              <i class="bi bi-plus-circle"></i> New Payor
            </button>
          </div>
        </div>

        <div class="entity-form" id="payorForm">
          <div class="form-group">
            <label for="payorNameInput">Payor Name (canonical)</label>
            <input type="text" id="payorNameInput" placeholder="e.g. Aetna" />
          </div>
          <div class="form-group">
            <label for="payorAliasesInput">Possible Names (aliases, comma separated)</label>
            <textarea id="payorAliasesInput" placeholder="aetna, aetna better health, ..."></textarea>
          </div>
          <div class="form-actions">
            <button class="btn btn-primary" id="updatePayorBtn"><i class="bi bi-pencil"></i> Update</button>
            <button class="btn btn-danger" id="deletePayorBtn"><i class="bi bi-trash3"></i> Delete</button>
            <button class="btn btn-outline" id="cancelPayorBtn" style="display:none;"><i class="bi bi-x-circle"></i> Cancel</button>
          </div>
          <div id="payorStatus" class="status-msg"></div>
        </div>
      </div>

      <div id="practicesPanel" class="admin-layout" style="display:none;">
        <div class="entity-list" id="practiceList">
          <div class="list-header">
            <span>Practices</span>
            <span style="font-weight:400; font-size:0.75rem; color:var(--muted);" id="practiceCount">0</span>
          </div>
          <div class="list-items" id="practiceItems"></div>
          <div class="list-footer">
            <button class="btn btn-success" id="addPracticeBtn" style="width:100%; justify-content:center;">
              <i class="bi bi-plus-circle"></i> New Practice
            </button>
          </div>
        </div>

        <div class="entity-form" id="practiceForm">
          <div class="form-group">
            <label for="practiceNameInput">Practice Name (canonical)</label>
            <input type="text" id="practiceNameInput" placeholder="e.g. ABC Medical Group" />
          </div>
          <div class="form-group">
            <label for="practiceAliasesInput">Possible Names (aliases, comma separated)</label>
            <textarea id="practiceAliasesInput" placeholder="abc medical, abc med group, ..."></textarea>
          </div>
          <div class="form-actions">
            <button class="btn btn-primary" id="updatePracticeBtn"><i class="bi bi-pencil"></i> Update</button>
            <button class="btn btn-danger" id="deletePracticeBtn"><i class="bi bi-trash3"></i> Delete</button>
            <button class="btn btn-outline" id="cancelPracticeBtn" style="display:none;"><i class="bi bi-x-circle"></i> Cancel</button>
          </div>
          <div id="practiceStatus" class="status-msg"></div>
        </div>
      </div>

      <!-- Bulk Import Section -->
      <div class="bulk-import-area" style="margin-top:20px;">
        <h4 style="font-size:0.95rem; font-weight:600; margin-bottom:8px;">
          <i class="bi bi-upload"></i> Bulk Import
        </h4>
        <p style="font-size:0.8rem; color:var(--muted); margin-bottom:8px;">
          Upload a CSV or Excel file with columns <code>names</code> and <code>possible names</code>.
        </p>
        <div class="bulk-actions" style="margin-bottom:8px;">
          <label for="bulkEntitySelect" style="font-size:0.8rem; color:var(--ink-soft); align-self:center;">Import as</label>
          <select id="bulkEntitySelect" class="btn" aria-label="Import entity type">
            <option value="payors">Payor</option>
            <option value="practices">Practice</option>
          </select>
          <input type="file" id="bulkEntityFile" accept=".csv,.xlsx,.xlsm" hidden>
          <button class="btn btn-primary" id="chooseEntityFileBtn" type="button">
            <i class="bi bi-file-earmark-spreadsheet"></i> Upload File
          </button>
          <button class="btn btn-success" id="submitEntityFileBtn" type="button">
            <i class="bi bi-check2-circle"></i> Submit
          </button>
        </div>
        <div id="selectedFileStatus" style="font-size:0.8rem; color:var(--muted); margin-bottom:8px;">No file selected.</div>
        <div class="bulk-actions">
          <button class="btn btn-outline" id="refreshBtn">
            <i class="bi bi-arrow-clockwise"></i> Refresh All
          </button>
        </div>
        <div id="bulkStatus" class="status-msg"></div>
      </div>
    </main>
  </div>
</div>

<script>
  // ============ State ============
  let payors = [];
  let practices = [];
  let selectedPayorIndex = -1;
  let selectedPracticeIndex = -1;
  let isNewPayor = false;
  let isNewPractice = false;
  let originalPayorName = '';
  let originalPracticeName = '';
  let currentTab = 'payors';

  // ============ DOM Refs ============
  const payorItems = document.getElementById('payorItems');
  const payorCount = document.getElementById('payorCount');
  const payorForm = document.getElementById('payorForm');
  const payorNameInput = document.getElementById('payorNameInput');
  const payorAliasesInput = document.getElementById('payorAliasesInput');
  const payorStatus = document.getElementById('payorStatus');

  const practiceItems = document.getElementById('practiceItems');
  const practiceCount = document.getElementById('practiceCount');
  const practiceForm = document.getElementById('practiceForm');
  const practiceNameInput = document.getElementById('practiceNameInput');
  const practiceAliasesInput = document.getElementById('practiceAliasesInput');
  const practiceStatus = document.getElementById('practiceStatus');

  const bulkStatus = document.getElementById('bulkStatus');
  const bulkEntitySelect = document.getElementById('bulkEntitySelect');
  const bulkEntityFile = document.getElementById('bulkEntityFile');
  const chooseEntityFileBtn = document.getElementById('chooseEntityFileBtn');
  const submitEntityFileBtn = document.getElementById('submitEntityFileBtn');
  const selectedFileStatus = document.getElementById('selectedFileStatus');

  // ============ Utility Functions ============
  function setStatus(element, msg, isError = false) {
    element.textContent = msg;
    element.className = 'status-msg' + (isError ? ' error' : ' success');
  }

  // ============ Tab Switching ============
  function switchTab(tab) {
    currentTab = tab;
    document.querySelectorAll('.tab').forEach(el => el.classList.toggle('active', el.dataset.tab === tab));
    document.getElementById('payorsPanel').style.display = tab === 'payors' ? 'flex' : 'none';
    document.getElementById('practicesPanel').style.display = tab === 'practices' ? 'flex' : 'none';
  }

  // ============ Payor Functions ============
  function renderPayors() {
    let html = '';
    if (payors.length === 0) {
      html = `<div style="color:var(--muted); text-align:center; padding:20px 0;">No payors defined</div>`;
    } else {
      payors.forEach((p, idx) => {
        const active = (!isNewPayor && idx === selectedPayorIndex) ? 'active' : '';
        const aliasCount = p.aliases ? p.aliases.length : 0;
        html += `
          <div class="list-item ${active}" data-index="${idx}">
            <span>${p.name || '(unnamed)'}</span>
            <span class="badge-aliases">${aliasCount} alias${aliasCount !== 1 ? 'es' : ''}</span>
          </div>
        `;
      });
    }
    payorItems.innerHTML = html;
    payorCount.textContent = payors.length;

    document.querySelectorAll('#payorItems .list-item').forEach(el => {
      el.addEventListener('click', () => {
        const idx = parseInt(el.dataset.index, 10);
        if (isNewPayor) {
          if (!confirm('You have unsaved changes. Discard and select existing payor?')) return;
          cancelNewPayor();
        }
        selectPayor(idx);
      });
    });
  }

  function selectPayor(idx) {
    if (idx < 0 || idx >= payors.length) {
      selectedPayorIndex = -1;
      originalPayorName = '';
      payorNameInput.value = '';
      payorAliasesInput.value = '';
      isNewPayor = false;
      payorForm.classList.remove('visible');
      renderPayors();
      return;
    }
    selectedPayorIndex = idx;
    const p = payors[idx];
    originalPayorName = p.name;
    payorNameInput.value = p.name || '';
    payorAliasesInput.value = (p.aliases || []).join(', ');
    isNewPayor = false;
    payorForm.classList.add('visible');
    document.getElementById('cancelPayorBtn').style.display = 'none';
    document.getElementById('updatePayorBtn').innerHTML = '<i class="bi bi-pencil"></i> Update';
    document.getElementById('deletePayorBtn').disabled = false;
    document.getElementById('addPayorBtn').style.display = 'flex';
    renderPayors();
    setStatus(payorStatus, `Editing "${p.name}"`);
  }

  function cancelNewPayor() {
    isNewPayor = false;
    if (selectedPayorIndex >= 0 && selectedPayorIndex < payors.length) {
      const p = payors[selectedPayorIndex];
      payorNameInput.value = p.name || '';
      payorAliasesInput.value = (p.aliases || []).join(', ');
      payorForm.classList.add('visible');
    } else {
      payorNameInput.value = '';
      payorAliasesInput.value = '';
      payorForm.classList.remove('visible');
    }
    document.getElementById('cancelPayorBtn').style.display = 'none';
    document.getElementById('updatePayorBtn').innerHTML = '<i class="bi bi-pencil"></i> Update';
    document.getElementById('deletePayorBtn').disabled = false;
    document.getElementById('addPayorBtn').style.display = 'flex';
    renderPayors();
    setStatus(payorStatus, 'Cancelled new payor.');
  }

  async function loadPayors() {
    try {
      const res = await fetch('/api/admin/payors');
      if (!res.ok) throw new Error('Failed to fetch payors');
      const data = await res.json();
      payors = data.payors || [];
      payors.sort((a, b) => a.name.localeCompare(b.name));
      selectedPayorIndex = -1;
      originalPayorName = '';
      payorNameInput.value = '';
      payorAliasesInput.value = '';
      isNewPayor = false;
      payorForm.classList.remove('visible');
      renderPayors();
    } catch (err) {
      setStatus(payorStatus, 'Error loading payors: ' + err.message, true);
    }
  }

  async function createPayor(name, aliases) {
    const res = await fetch('/api/admin/payor', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name, aliases }),
    });
    if (!res.ok) {
      const err = await res.json();
      throw new Error(err.detail || 'Failed to create payor');
    }
    return await res.json();
  }

  async function updatePayor(name, aliases) {
    const res = await fetch(`/api/admin/payor/${encodeURIComponent(name)}`, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ aliases }),
    });
    if (!res.ok) {
      const err = await res.json();
      throw new Error(err.detail || 'Failed to update payor');
    }
    return await res.json();
  }

  async function deletePayor(name) {
    const res = await fetch(`/api/admin/payor/${encodeURIComponent(name)}`, {
      method: 'DELETE',
    });
    if (!res.ok) {
      const err = await res.json();
      throw new Error(err.detail || 'Failed to delete payor');
    }
    return await res.json();
  }

  async function savePayor() {
    const name = payorNameInput.value.trim();
    if (!name) {
      setStatus(payorStatus, 'Payor name cannot be empty.', true);
      return;
    }
    const aliases = payorAliasesInput.value.split(',').map(s => s.trim()).filter(Boolean);

    const duplicate = payors.some((p, idx) => {
      if (isNewPayor) return p.name.toLowerCase() === name.toLowerCase();
      return idx !== selectedPayorIndex && p.name.toLowerCase() === name.toLowerCase();
    });
    if (duplicate) {
      setStatus(payorStatus, `A payor with name "${name}" already exists.`, true);
      return;
    }

    try {
      if (isNewPayor) {
        await createPayor(name, aliases);
        setStatus(payorStatus, `Created "${name}".`);
        await loadPayors();
        const newIdx = payors.findIndex(p => p.name === name);
        if (newIdx >= 0) {
          selectedPayorIndex = newIdx;
          selectPayor(newIdx);
        }
      } else {
        const oldName = originalPayorName;
        if (oldName.toLowerCase() !== name.toLowerCase()) {
          await deletePayor(oldName);
          await createPayor(name, aliases);
          setStatus(payorStatus, `Renamed "${oldName}" → "${name}".`);
        } else {
          await updatePayor(oldName, aliases);
          setStatus(payorStatus, `Updated "${name}".`);
        }
        await loadPayors();
        const newIdx = payors.findIndex(p => p.name === name);
        if (newIdx >= 0) {
          selectedPayorIndex = newIdx;
          selectPayor(newIdx);
        }
      }
    } catch (err) {
      setStatus(payorStatus, 'Error: ' + err.message, true);
    }
  }

  async function deleteCurrentPayor() {
    if (isNewPayor) {
      setStatus(payorStatus, 'Cannot delete a new payor that is not saved yet.', true);
      return;
    }
    if (selectedPayorIndex < 0 || selectedPayorIndex >= payors.length) {
      setStatus(payorStatus, 'No payor selected.', true);
      return;
    }
    const name = payors[selectedPayorIndex].name || '(unnamed)';
    if (!confirm(`Delete payor "${name}"?`)) return;
    try {
      await deletePayor(name);
      setStatus(payorStatus, `Deleted "${name}".`);
      await loadPayors();
      selectedPayorIndex = -1;
      originalPayorName = '';
      payorNameInput.value = '';
      payorAliasesInput.value = '';
      isNewPayor = false;
      payorForm.classList.remove('visible');
      renderPayors();
    } catch (err) {
      setStatus(payorStatus, 'Error: ' + err.message, true);
    }
  }

  function startNewPayor() {
    payorNameInput.value = '';
    payorAliasesInput.value = '';
    selectedPayorIndex = -1;
    originalPayorName = '';
    isNewPayor = true;
    payorForm.classList.add('visible');
    document.getElementById('cancelPayorBtn').style.display = 'inline-flex';
    document.getElementById('updatePayorBtn').innerHTML = '<i class="bi bi-plus-circle"></i> Create';
    document.getElementById('deletePayorBtn').disabled = true;
    document.getElementById('addPayorBtn').style.display = 'none';
    renderPayors();
    setStatus(payorStatus, 'Enter new payor details, then click "Create".');
    payorNameInput.focus();
  }

  // ============ Practice Functions ============
  function renderPractices() {
    let html = '';
    if (practices.length === 0) {
      html = `<div style="color:var(--muted); text-align:center; padding:20px 0;">No practices defined</div>`;
    } else {
      practices.forEach((p, idx) => {
        const active = (!isNewPractice && idx === selectedPracticeIndex) ? 'active' : '';
        const aliasCount = p.aliases ? p.aliases.length : 0;
        html += `
          <div class="list-item ${active}" data-index="${idx}">
            <span>${p.name || '(unnamed)'}</span>
            <span class="badge-aliases">${aliasCount} alias${aliasCount !== 1 ? 'es' : ''}</span>
          </div>
        `;
      });
    }
    practiceItems.innerHTML = html;
    practiceCount.textContent = practices.length;

    document.querySelectorAll('#practiceItems .list-item').forEach(el => {
      el.addEventListener('click', () => {
        const idx = parseInt(el.dataset.index, 10);
        if (isNewPractice) {
          if (!confirm('You have unsaved changes. Discard and select existing practice?')) return;
          cancelNewPractice();
        }
        selectPractice(idx);
      });
    });
  }

  function selectPractice(idx) {
    if (idx < 0 || idx >= practices.length) {
      selectedPracticeIndex = -1;
      originalPracticeName = '';
      practiceNameInput.value = '';
      practiceAliasesInput.value = '';
      isNewPractice = false;
      practiceForm.classList.remove('visible');
      renderPractices();
      return;
    }
    selectedPracticeIndex = idx;
    const p = practices[idx];
    originalPracticeName = p.name;
    practiceNameInput.value = p.name || '';
    practiceAliasesInput.value = (p.aliases || []).join(', ');
    isNewPractice = false;
    practiceForm.classList.add('visible');
    document.getElementById('cancelPracticeBtn').style.display = 'none';
    document.getElementById('updatePracticeBtn').innerHTML = '<i class="bi bi-pencil"></i> Update';
    document.getElementById('deletePracticeBtn').disabled = false;
    document.getElementById('addPracticeBtn').style.display = 'flex';
    renderPractices();
    setStatus(practiceStatus, `Editing "${p.name}"`);
  }

  function cancelNewPractice() {
    isNewPractice = false;
    if (selectedPracticeIndex >= 0 && selectedPracticeIndex < practices.length) {
      const p = practices[selectedPracticeIndex];
      practiceNameInput.value = p.name || '';
      practiceAliasesInput.value = (p.aliases || []).join(', ');
      practiceForm.classList.add('visible');
    } else {
      practiceNameInput.value = '';
      practiceAliasesInput.value = '';
      practiceForm.classList.remove('visible');
    }
    document.getElementById('cancelPracticeBtn').style.display = 'none';
    document.getElementById('updatePracticeBtn').innerHTML = '<i class="bi bi-pencil"></i> Update';
    document.getElementById('deletePracticeBtn').disabled = false;
    document.getElementById('addPracticeBtn').style.display = 'flex';
    renderPractices();
    setStatus(practiceStatus, 'Cancelled new practice.');
  }

  async function loadPractices() {
    try {
      const res = await fetch('/api/admin/practices');
      if (!res.ok) throw new Error('Failed to fetch practices');
      const data = await res.json();
      practices = data.practices || [];
      practices.sort((a, b) => a.name.localeCompare(b.name));
      selectedPracticeIndex = -1;
      originalPracticeName = '';
      practiceNameInput.value = '';
      practiceAliasesInput.value = '';
      isNewPractice = false;
      practiceForm.classList.remove('visible');
      renderPractices();
    } catch (err) {
      setStatus(practiceStatus, 'Error loading practices: ' + err.message, true);
    }
  }

  async function createPractice(name, aliases) {
    const res = await fetch('/api/admin/practice', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name, aliases }),
    });
    if (!res.ok) {
      const err = await res.json();
      throw new Error(err.detail || 'Failed to create practice');
    }
    return await res.json();
  }

  async function updatePractice(name, aliases) {
    const res = await fetch(`/api/admin/practice/${encodeURIComponent(name)}`, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ aliases }),
    });
    if (!res.ok) {
      const err = await res.json();
      throw new Error(err.detail || 'Failed to update practice');
    }
    return await res.json();
  }

  async function deletePractice(name) {
    const res = await fetch(`/api/admin/practice/${encodeURIComponent(name)}`, {
      method: 'DELETE',
    });
    if (!res.ok) {
      const err = await res.json();
      throw new Error(err.detail || 'Failed to delete practice');
    }
    return await res.json();
  }

  async function savePractice() {
    const name = practiceNameInput.value.trim();
    if (!name) {
      setStatus(practiceStatus, 'Practice name cannot be empty.', true);
      return;
    }
    const aliases = practiceAliasesInput.value.split(',').map(s => s.trim()).filter(Boolean);

    const duplicate = practices.some((p, idx) => {
      if (isNewPractice) return p.name.toLowerCase() === name.toLowerCase();
      return idx !== selectedPracticeIndex && p.name.toLowerCase() === name.toLowerCase();
    });
    if (duplicate) {
      setStatus(practiceStatus, `A practice with name "${name}" already exists.`, true);
      return;
    }

    try {
      if (isNewPractice) {
        await createPractice(name, aliases);
        setStatus(practiceStatus, `Created "${name}".`);
        await loadPractices();
        const newIdx = practices.findIndex(p => p.name === name);
        if (newIdx >= 0) {
          selectedPracticeIndex = newIdx;
          selectPractice(newIdx);
        }
      } else {
        const oldName = originalPracticeName;
        if (oldName.toLowerCase() !== name.toLowerCase()) {
          await deletePractice(oldName);
          await createPractice(name, aliases);
          setStatus(practiceStatus, `Renamed "${oldName}" → "${name}".`);
        } else {
          await updatePractice(oldName, aliases);
          setStatus(practiceStatus, `Updated "${name}".`);
        }
        await loadPractices();
        const newIdx = practices.findIndex(p => p.name === name);
        if (newIdx >= 0) {
          selectedPracticeIndex = newIdx;
          selectPractice(newIdx);
        }
      }
    } catch (err) {
      setStatus(practiceStatus, 'Error: ' + err.message, true);
    }
  }

  async function deleteCurrentPractice() {
    if (isNewPractice) {
      setStatus(practiceStatus, 'Cannot delete a new practice that is not saved yet.', true);
      return;
    }
    if (selectedPracticeIndex < 0 || selectedPracticeIndex >= practices.length) {
      setStatus(practiceStatus, 'No practice selected.', true);
      return;
    }
    const name = practices[selectedPracticeIndex].name || '(unnamed)';
    if (!confirm(`Delete practice "${name}"?`)) return;
    try {
      await deletePractice(name);
      setStatus(practiceStatus, `Deleted "${name}".`);
      await loadPractices();
      selectedPracticeIndex = -1;
      originalPracticeName = '';
      practiceNameInput.value = '';
      practiceAliasesInput.value = '';
      isNewPractice = false;
      practiceForm.classList.remove('visible');
      renderPractices();
    } catch (err) {
      setStatus(practiceStatus, 'Error: ' + err.message, true);
    }
  }

  function startNewPractice() {
    practiceNameInput.value = '';
    practiceAliasesInput.value = '';
    selectedPracticeIndex = -1;
    originalPracticeName = '';
    isNewPractice = true;
    practiceForm.classList.add('visible');
    document.getElementById('cancelPracticeBtn').style.display = 'inline-flex';
    document.getElementById('updatePracticeBtn').innerHTML = '<i class="bi bi-plus-circle"></i> Create';
    document.getElementById('deletePracticeBtn').disabled = true;
    document.getElementById('addPracticeBtn').style.display = 'none';
    renderPractices();
    setStatus(practiceStatus, 'Enter new practice details, then click "Create".');
    practiceNameInput.focus();
  }

  async function uploadEntityFile() {
    const entity = bulkEntitySelect.value;
    const file = bulkEntityFile.files[0];
    const label = entity === 'payors' ? 'payor' : 'practice';
    if (!file) {
      setStatus(bulkStatus, `Choose a ${label} file first, then submit.`, true);
      return;
    }
    const formData = new FormData();
    formData.append('file', file);
    const originalButtonHTML = submitEntityFileBtn.innerHTML;
    submitEntityFileBtn.disabled = true;
    submitEntityFileBtn.innerHTML = '<span class="btn-loader" aria-hidden="true"></span> Updating...';
    try {
      const url = entity === 'payors' ? '/api/admin/payors/bulk-csv' : '/api/admin/practices/bulk-csv';
      const res = await fetch(url, { method: 'POST', body: formData });
      if (!res.ok) {
        const err = await res.json();
        throw new Error(err.detail || `Failed to import ${label}`);
      }
      const result = await res.json();
      let msg = `Imported ${result.created} new, updated ${result.updated}.`;
      if (result.errors.length > 0) msg += ` ${result.errors.length} errors.`;
      setStatus(bulkStatus, msg, result.errors.length > 0);
      bulkEntityFile.value = '';
      selectedFileStatus.textContent = 'No file selected.';
      await loadPayors();
      await loadPractices();
    } catch (err) {
      setStatus(bulkStatus, 'Error: ' + err.message, true);
    } finally {
      submitEntityFileBtn.disabled = false;
      submitEntityFileBtn.innerHTML = originalButtonHTML;
    }
  }

  // ============ Refresh All ============
  async function refreshAll() {
    await Promise.all([loadPayors(), loadPractices()]);
    setStatus(bulkStatus, 'Refreshed all data.');
  }

  // ============ Event Listeners ============
  document.getElementById('addPayorBtn').addEventListener('click', startNewPayor);
  document.getElementById('updatePayorBtn').addEventListener('click', savePayor);
  document.getElementById('deletePayorBtn').addEventListener('click', deleteCurrentPayor);
  document.getElementById('cancelPayorBtn').addEventListener('click', cancelNewPayor);

  document.getElementById('addPracticeBtn').addEventListener('click', startNewPractice);
  document.getElementById('updatePracticeBtn').addEventListener('click', savePractice);
  document.getElementById('deletePracticeBtn').addEventListener('click', deleteCurrentPractice);
  document.getElementById('cancelPracticeBtn').addEventListener('click', cancelNewPractice);

  chooseEntityFileBtn.addEventListener('click', () => bulkEntityFile.click());
  bulkEntityFile.addEventListener('change', () => {
    const label = bulkEntitySelect.value === 'payors' ? 'payor' : 'practice';
    selectedFileStatus.textContent = bulkEntityFile.files[0]
      ? `Selected ${label} file: ${bulkEntityFile.files[0].name}`
      : 'No file selected.';
  });
  bulkEntitySelect.addEventListener('change', () => {
    bulkEntityFile.value = '';
    selectedFileStatus.textContent = 'No file selected.';
    setStatus(bulkStatus, '');
  });
  submitEntityFileBtn.addEventListener('click', uploadEntityFile);
  document.getElementById('refreshBtn').addEventListener('click', refreshAll);

  // ============ Init ============
  loadPayors();
  loadPractices();
</script>
</body>
</html>
